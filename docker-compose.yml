services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "80"
    volumes:
      - static_data:/var/www/static:ro
      - media_data:/var/www/media:ro
    networks:
      - internal

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    depends_on:
      - redis
    expose:
      - "8000"
    command: ["/app/docker/backend/start-web.sh"]
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
    networks:
      - internal
      - dokploy-network

  celery-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    depends_on:
      - redis
      - backend
    command: ["celery", "-A", "config", "worker", "-l", "info", "--concurrency=2"]
    networks:
      - internal
      - dokploy-network

  celery-beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    depends_on:
      - redis
      - backend
    command: ["celery", "-A", "config", "beat", "-l", "info"]
    networks:
      - internal
      - dokploy-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - internal

volumes:
  redis_data:
  static_data:
  media_data:

networks:
  internal:
  dokploy-network:
    external: true
